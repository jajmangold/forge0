log:
  level: info

runner:
  file: /data/.runner
  capacity: 1
  timeout: 30m
  shutdown_timeout: 5m
  fetch_timeout: 5s
  fetch_interval: 2s
  # Execution labels are stored in the registration record with the base
  # image's content digest. Leaving this empty prevents tag-based overrides.
  labels: []

cache:
  enabled: false

container:
  network: forge0_default
  privileged: false
  valid_volumes: []
  docker_host: "-"
  force_pull: false
  force_rebuild: false
  require_docker: true
  docker_timeout: 30s
