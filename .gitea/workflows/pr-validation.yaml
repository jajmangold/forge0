name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: pr-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate review-ready change
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft }}
    runs-on: forge0-ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Enforce no-churn pipeline invariants
        run: python ci/verify.py

      - name: Unit tests
        run: pytest -q

      - name: Lint
        run: ruff check portal/app portal/tests ci/verify.py

      - name: Type check
        run: pyright portal/app

      - name: Validate Compose without a daemon
        run: |
          test ! -S /var/run/docker.sock
          docker compose config --quiet

      - name: Validate branch name
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BRANCH: ${{ github.head_ref }}
        run: |
          if [[ ! "$BRANCH" =~ ^(agent|feature|fix|docs|refactor)/ ]]; then
            echo "Branch '$BRANCH' must use agent/, feature/, fix/, docs/, or refactor/."
            exit 1
          fi

      - name: Validate commit messages
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          invalid=0
          while read -r hash message; do
            if [[ ! "$message" =~ ^(feat|fix|docs|test|refactor|perf|chore|ci)(\(.+\))?\!?: ]]; then
              echo "Invalid commit $hash: $message"
              invalid=1
            fi
          done < <(git log origin/main..HEAD --format="%H %s")
          test "$invalid" -eq 0

      - name: Validate PR metadata
        if: ${{ github.event_name == 'pull_request' }}
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: |
          test -n "$PR_BODY" || { echo "PR description is empty."; exit 1; }
          [[ "$PR_BODY" == *"## Summary"* ]] || { echo "PR needs a Summary section."; exit 1; }
          [[ "$PR_BODY" == *"## Related Issues"* ]] || { echo "PR needs a Related Issues section."; exit 1; }
          [[ "$PR_LABELS" == *"type:"* ]] || { echo "PR needs a type: label."; exit 1; }
