name: Auto Documentation
on:
  push:
    branches: [main]
    paths:
      - 'src/**/*.py'
      - 'pyproject.toml'
      - 'README.md'

jobs:
  changelog:
    name: Generate Changelog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        run: |
          # Get conventional commits since last tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$LAST_TAG" ]; then
            COMMITS=$(git log $LAST_TAG..HEAD --format="%s" --no-merges)
          else
            COMMITS=$(git log --format="%s" --no-merges)
          fi

          # Parse into categories
          FEATS=$(echo "$COMMITS" | grep "^feat" | sed 's/^feat[^:]*: //' || true)
          FIXES=$(echo "$COMMITS" | grep "^fix" | sed 's/^fix[^:]*: //' || true)
          DOCS=$(echo "$COMMITS" | grep "^docs" | sed 's/^docs[^:]*: //' || true)
          REFACTORS=$(echo "$COMMITS" | grep "^refactor" | sed 's/^refactor[^:]*: //' || true)

          # Generate CHANGELOG.md
          cat > CHANGELOG.md << EOF
          # Changelog

          All notable changes to this project will be documented in this file.

          The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
          and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).

          ## [Unreleased]

          ### Added
          $FEATS

          ### Fixed
          $FIXES

          ### Changed
          $REFACTORS

          ### Documentation
          $DOCS
          EOF

      - name: Commit changelog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff --staged --quiet || git commit -m "docs: update CHANGELOG.md"
          git push || true

  readme:
    name: Update README
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update README section
        run: |
          # Auto-generate API section from docstrings
          if [ -f "scripts/generate_readme.py" ]; then
            python scripts/generate_readme.py > README_NEW.md
            if [ -s README_NEW.md ]; then
              mv README_NEW.md README.md
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git add README.md
              git diff --staged --quiet || git commit -m "docs: auto-update README.md"
              git push || true
            fi
          fi
