name: Auto Documentation

on:
  push:
    branches: [main]
    paths:
      - 'portal/**/*.py'
      - 'pyproject.toml'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: auto-documentation-main
  cancel-in-progress: true

jobs:
  documentation:
    name: Refresh generated documentation
    runs-on: forge0-ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Generate changelog
        run: |
          last_tag=$(git describe --tags --abbrev=0 2>/dev/null || true)
          if [ -n "$last_tag" ]; then
            commits=$(git log "$last_tag"..HEAD --format="%s" --no-merges)
          else
            commits=$(git log --format="%s" --no-merges)
          fi
          features=$(printf '%s\n' "$commits" | grep '^feat' | sed 's/^feat[^:]*: /- /' || true)
          fixes=$(printf '%s\n' "$commits" | grep '^fix' | sed 's/^fix[^:]*: /- /' || true)
          docs=$(printf '%s\n' "$commits" | grep '^docs' | sed 's/^docs[^:]*: /- /' || true)
          cat > CHANGELOG.md <<EOF
          # Changelog

          ## Unreleased

          ### Added
          ${features:-_None._}

          ### Fixed
          ${fixes:-_None._}

          ### Documentation
          ${docs:-_None._}
          EOF

      - name: Refresh README API section when a generator exists
        run: |
          if [ -f scripts/generate_readme.py ]; then
            python scripts/generate_readme.py > README.generated.md
            test -s README.generated.md
            mv README.generated.md README.md
          fi

      - name: Commit documentation only when changed
        run: |
          git config user.name "forge0-docs"
          git config user.email "forge0-docs@localhost"
          git add CHANGELOG.md README.md
          if ! git diff --staged --quiet; then
            git commit -m "docs: refresh generated documentation"
            git push
          fi
