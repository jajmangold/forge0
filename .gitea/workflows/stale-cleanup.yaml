name: Stale Cleanup

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

concurrency:
  group: repository-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    name: Repository maintenance
    runs-on: forge0-ci
    steps:
      - name: Mark stale issues and pull requests
        uses: actions/stale@5bef64f19d7facfb25b37b414482c7164d639639
        with:
          days-before-stale: 30
          days-before-close: 7
          days-before-pr-stale: 14
          days-before-pr-close: 7
          stale-issue-label: 'status:stale'
          stale-pr-label: 'status:stale'
          exempt-issue-labels: 'priority:critical,status:blocked'
          exempt-pr-labels: 'priority:critical,status:blocked'
          stale-issue-message: 'This issue is stale and will close in 7 days without activity.'
          stale-pr-message: 'This pull request is stale and will close in 7 days without activity.'
          close-issue-message: 'Closed automatically after the stale period.'
          close-pr-message: 'Closed automatically after the stale period.'

      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0

      - name: Remove merged remote branches
        run: |
          git fetch --prune
          git branch -r --merged origin/main \
            | sed 's#^[[:space:]]*origin/##' \
            | grep -Ev '^(main|HEAD)$' \
            | while read -r branch; do git push origin --delete "$branch" || true; done
