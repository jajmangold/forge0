services:
  gitea:
    image: gitea/gitea:1.27.0
    container_name: forge0
    restart: unless-stopped
    mem_limit: 4g
    mem_reservation: 1g
    ports:
      - "127.0.0.1:3000:3000"
      - "127.0.0.1:2222:22"
    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY:-auto}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN:-auto}
      GITEA__security__ALLOWED_HOST_LIST: "*"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3001/gitea/}
      GITEA__server__LOCAL_ROOT_URL: ${GITEA_LOCAL_ROOT_URL:-http://localhost:3000/}
      GITEA__server__PUBLIC_URL_DETECTION: "never"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN:-localhost}
      GITEA__server__LFS_START_SERVER: "true"
      GITEA__server__OFFLINE_MODE: "false"
      GITEA__DEFAULT__RUN_MODE: "prod"
      GITEA__api__ENABLE_SWAGGER: "true"
      GITEA__api__MAX_RESPONSE_ITEMS: 1000
      GITEA__webhook__SKIP_TLS_VERIFY: "true"
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__repository__ENABLE_PUSH_CREATE_USER: "true"
      GITEA__repository__ENABLE_PUSH_CREATE_ORG: "true"
      GITEA__repository__DISABLE_STARS: "true"
      GITEA__ui__DEFAULT_SHOW_FULL_NAME: "false"
      GITEA__mailer__ENABLED: "false"
      GITEA__log__MODE: console
      GITEA__log__LEVEL: Info
      GITEA__i18n__LANGS: en-US
      GITEA__i18n__NAMES: English
    healthcheck:
      test: ["CMD", "curl", "-fsSL", "http://localhost:3000/api/v1/version"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    image: forge0-portal:latest
    container_name: forge0-portal
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      GITEA_URL: http://gitea:3000
      GITEA_PUBLIC_URL: ${GITEA_ROOT_URL:-http://localhost:3001/gitea/}
      GITEA_TOKEN: ${GITEA_API_TOKEN}
      GITEA_ADMIN_USER: ${GITEA_ADMIN_USER:-agent}
      GITEA_ADMIN_PASS: ${GITEA_ADMIN_PASS:-agentpass123}
      GITEA_AUTO_LOGIN: ${GITEA_AUTO_LOGIN:-false}
      GITEA_OAUTH_CLIENT_ID: ${GITEA_OAUTH_CLIENT_ID:-}
      GITEA_OAUTH_CLIENT_SECRET: ${GITEA_OAUTH_CLIENT_SECRET:-}
      FORGE0_SESSION_SECRET: ${FORGE0_SESSION_SECRET:-}
      FORGE0_OAUTH_REDIRECT_URI: ${FORGE0_OAUTH_REDIRECT_URI:-http://localhost:3001/auth/callback}
      FORGE0_ALLOWED_USERS: ${FORGE0_ALLOWED_USERS:-josh}
      SEARXNG_URL: http://searxng:8080
      OPENCODE_API_KEY: ${OPENCODE_API_KEY}
      OPENCODE_BASE_URL: ${OPENCODE_BASE_URL:-https://opencode.ai/zen/go/v1}
      LLM_PLANNER_MODEL: ${LLM_PLANNER_MODEL:-mimo-v2.5-pro}
      LLM_WORKER_MODEL: ${LLM_WORKER_MODEL:-mimo-v2.5}
      LLM_CRITIC_MODEL: ${LLM_CRITIC_MODEL:-mimo-v2.5}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-180}
      LLM_MAX_ATTEMPTS: ${LLM_MAX_ATTEMPTS:-3}
      FORGE0_SELF_REPO: ${FORGE0_SELF_REPO:-agent/forge0}
      FORGE0_DATA_DIR: /var/lib/forge0
      FORGE0_OPERATOR_TOKEN: ${FORGE0_OPERATOR_TOKEN:-}
      FORGE0_WEBHOOK_SECRET: ${FORGE0_WEBHOOK_SECRET:-}
      FORGE0_DOGFOOD_LABEL: ${FORGE0_DOGFOOD_LABEL:-agent:ready}
      FORGE0_CODER_MODEL: ${FORGE0_CODER_MODEL:-planner}
      FORGE0_MAX_CHANGED_FILES: ${FORGE0_MAX_CHANGED_FILES:-5}
      FORGE0_MAX_FILE_BYTES: ${FORGE0_MAX_FILE_BYTES:-128000}
      FORGE0_MAX_DIFF_LINES: ${FORGE0_MAX_DIFF_LINES:-500}
      FORGE0_MAX_KERNEL_DIFF_LINES: ${FORGE0_MAX_KERNEL_DIFF_LINES:-2000}
      FORGE0_MAX_CRITIC_DIFF_CHARS: ${FORGE0_MAX_CRITIC_DIFF_CHARS:-160000}
      FORGE0_MAX_CRITIC_REPAIRS: ${FORGE0_MAX_CRITIC_REPAIRS:-1}
      FORGE0_MAX_VERIFICATION_REPAIRS: ${FORGE0_MAX_VERIFICATION_REPAIRS:-1}
      FORGE0_RUN_TOKEN_BUDGET: ${FORGE0_RUN_TOKEN_BUDGET:-100000}
      FORGE0_KEEP_WORKSPACES: ${FORGE0_KEEP_WORKSPACES:-false}
    volumes:
      - dogfood-data:/var/lib/forge0
    depends_on:
      gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3001/readyz', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  runner:
    image: docker.io/gitea/act_runner:0.2.13@sha256:8477d5b61b655caad4449888bae39f1f34bebd27db56cb15a62dccb3dcf3a944
    container_name: forge0-runner
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 128m
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000/
      GITEA_RUNNER_NAME: forge0-ci
    volumes:
      - runner-data:/data
      - ./runner/config.yaml:/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      gitea:
        condition: service_healthy

  searxng:
    image: searxng/searxng@sha256:268fdb05efbb7b4fdc5957a20c42389bfb1b1b27b5eddeb98f75ec80c45b960f
    container_name: forge0-search
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 128m
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng:/etc/searxng:rw
      - searxng-data:/var/cache/searxng:rw
    environment:
      SEARXNG_BASE_URL: "http://localhost:8888/"
      SEARXNG_SECRET: "${SEARXNG_SECRET_KEY:-forge0-super-secret-key-change-me}"

  wandb:
    image: wandb/local@sha256:c9edd35abe64ebf91a090782696c9db82c37272fa6863579bc3da871df35b138
    container_name: forge0-wandb
    restart: unless-stopped
    mem_limit: 2g
    mem_reservation: 512m
    profiles: ["observability"]
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - wandb-data:/vol
    environment:
      LOCAL_USERNAME: admin
      LOCAL_PASSWORD: ${WANDB_PASSWORD:-forge0-wandb-admin}
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 30s
      timeout: 10s
      retries: 5

  optuna:
    image: python:3.12-slim@sha256:c3d81d25b3154142b0b42eb1e61300024426268edeb5b5a26dd7ddf64d9daf28
    container_name: forge0-optuna
    restart: "no"
    mem_limit: 1g
    mem_reservation: 256m
    profiles: ["optimization"]
    command:
      - sh
      - -c
      - >-
        pip install --no-cache-dir optuna
        && python -c "import optuna; optuna.create_study(study_name='forge0',
        storage='sqlite:///data/optuna.db', load_if_exists=True); print('Optuna study ready')"
    volumes:
      - optuna-data:/data

volumes:
  dogfood-data:
  runner-data:
    name: forge0-runner-data
    external: true
  searxng-data:
  wandb-data:
  optuna-data:
