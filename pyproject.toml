[tool.pytest.ini_options]
addopts = "-q --strict-markers"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["portal"]
testpaths = ["portal/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120
exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pyright]
pythonVersion = "3.12"
include = ["portal/app"]
exclude = ["data"]
typeCheckingMode = "standard"
